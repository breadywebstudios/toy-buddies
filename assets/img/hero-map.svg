<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- faint latitude / longitude lines -->
  <g stroke="#7A5A33" stroke-opacity=".14" stroke-width="1.5">
    <path d="M0 130H1600M0 260H1600M0 390H1600"/>
    <path d="M200 0V520M400 0V520M600 0V520M800 0V520M1000 0V520M1200 0V520M1400 0V520"/>
  </g>

  <!-- islands (left) -->
  <g stroke="#5B4026" stroke-width="3" fill="#D9C08A" fill-opacity=".7">
    <path d="M40 380c18-40 70-58 112-44 30 10 44-14 76-8 40 8 58 46 40 78-16 28-60 34-96 28-30-5-48 18-86 10-40-8-62-32-46-64z"/>
    <path d="M250 150c10-24 44-30 64-16 16 11 36 4 50 18 14 15 4 40-20 46-22 6-36-6-56 2-26 10-50-24-38-50z"/>
  </g>
  <g stroke="#5B4026" stroke-opacity=".45" stroke-width="2" fill="none">
    <path d="M30 382c20-50 80-70 124-54M240 146c14-30 52-36 74-20"/>
  </g>
  <!-- palm tree on the big island -->
  <g stroke="#3E2A16" stroke-width="3">
    <path d="M150 368c4-22 2-40-6-58"/>
    <path d="M144 310c-14-10-32-10-44 0M144 310c10-14 28-18 42-12M144 310c-4-16 2-30 14-38M144 310c-16-4-28 4-34 16"/>
  </g>

  <!-- islands (right) -->
  <g stroke="#5B4026" stroke-width="3" fill="#D9C08A" fill-opacity=".7">
    <path d="M1310 420c14-34 62-50 100-36 26 9 50-6 80 6 34 14 44 52 20 74-22 20-62 18-96 12-28-5-52 10-84-4-26-12-32-32-20-52z"/>
    <path d="M1440 170c12-20 42-24 58-10 12 10 30 8 38 22 10 18-6 36-28 38-18 2-30-8-46-2-20 8-34-26-22-48z"/>
  </g>

  <!-- dotted route: from the left island, arcing around the title, to the X -->
  <path d="M200 340C300 470 520 480 640 440S900 380 1000 450 1260 500 1370 440" stroke="#B21E26" stroke-width="5" stroke-dasharray="2 16" opacity=".85"/>

  <!-- X marks the spot -->
  <g stroke="#B21E26" stroke-width="9">
    <path d="M1392 418l36 36M1428 418l-36 36"/>
  </g>

  <!-- compass rose (top right) -->
  <g transform="translate(1440 125) scale(.85)">
    <circle r="62" stroke="#5B4026" stroke-width="2.5" stroke-opacity=".8"/>
    <circle r="50" stroke="#5B4026" stroke-width="1.5" stroke-opacity=".5" stroke-dasharray="3 6"/>
    <path d="M0-74L12-12 0 0-12-12z" fill="#B21E26" stroke="#3E2A16" stroke-width="2"/>
    <path d="M0 74L12 12 0 0-12 12z" fill="#EADBB4" stroke="#3E2A16" stroke-width="2"/>
    <path d="M74 0L12 12 0 0 12-12z" fill="#EADBB4" stroke="#3E2A16" stroke-width="2"/>
    <path d="M-74 0L-12 12 0 0-12-12z" fill="#3E2A16" stroke="#3E2A16" stroke-width="2"/>
    <path d="M0-74L12-12 0 0" fill="#7E1218"/>
    <circle r="5" fill="#3E2A16"/>
    <text y="-82" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3E2A16">N</text>
  </g>

  <!-- little waves scattered on the sea -->
  <g stroke="#1E5FA8" stroke-opacity=".35" stroke-width="3">
    <path d="M420 90q12-10 24 0t24 0M460 112q12-10 24 0"/>
    <path d="M1120 120q12-10 24 0t24 0M1160 142q12-10 24 0"/>
    <path d="M520 300q12-10 24 0t24 0"/>
    <path d="M1060 330q12-10 24 0t24 0"/>
    <path d="M80 230q12-10 24 0t24 0"/>
    <path d="M1230 280q12-10 24 0t24 0"/>
  </g>

  <!-- small sailing ship on the route -->
  <g transform="translate(980 410) rotate(-6)" stroke="#3E2A16" stroke-width="3">
    <path d="M-34 0h68l-12 18h-44z" fill="#8A5A2E"/>
    <path d="M0 0v-52" />
    <path d="M2-48c18 6 22 22 18 40H2z" fill="#F4EAD0"/>
    <path d="M-2-44c-16 6-20 18-16 34h16z" fill="#F4EAD0"/>
    <path d="M0-52l14-6v10z" fill="#B21E26"/>
  </g>
</svg>
