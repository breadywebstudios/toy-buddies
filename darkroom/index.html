<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bready Darkroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: darkroom workstation — filter rack left, light table centre, adjustment stack right; stacks on phones.
   Deliberately single-theme neutral dark so colour judgement isn't biased by the UI. Accent = safelight amber. */
:root{
  --bg:#18181a; --panel:#212124; --panel-2:#2a2a2e; --line:#36363b;
  --fg:#e9e7e4; --muted:#9b989f; --faint:#6c6a70;
  --accent:#f0a04b; --accent-ink:#1a1206; --danger:#ff5b4d;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr) 332px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "filters view adjust"}
header{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:600 16px/1 var(--font-cond);letter-spacing:.02em;margin-right:10px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.grp{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:#4a4a50}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.icon{padding:6px 8px;min-width:32px}
.zoomlbl{font:500 12px var(--font-mono);min-width:52px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.spacer{flex:1}

/* filter rack */
.filters{grid-area:filters;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;color:var(--muted);font:500 12px var(--font-cond);letter-spacing:.06em;text-transform:uppercase}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.amount{padding:10px 12px;border-bottom:1px solid var(--line)}
.tiles{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.tile{position:relative;background:none;border:1px solid transparent;border-radius:6px;padding:3px;text-align:left;color:var(--muted)}
.tile canvas{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;background:var(--panel-2)}
.tile span{display:block;font-size:11.5px;padding:4px 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover{color:var(--fg)}
.tile.on{border-color:var(--accent);color:var(--fg)}
.tile .del{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;padding:0}
.savelook{grid-column:1/-1;display:flex;gap:6px}
.savelook input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.empty{grid-column:1/-1;color:var(--muted);font-size:12px;padding:6px 2px}

/* light table */
.center{grid-area:view;display:flex;flex-direction:column;min-width:0;min-height:0}
.view{flex:1;position:relative;overflow:hidden;background:#111113;touch-action:none;min-height:0}
/* photo strip: the shoot, one shared look */
.strip{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px}
.strip-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.strip-head .count{font:600 12px var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.strip-head .note{font-size:12px;color:var(--faint);flex:1;min-width:140px}
.strip-head .btn{font-size:12px;padding:5px 9px}
.strip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.ph{position:relative;flex:0 0 auto;width:104px;background:none;border:1px solid transparent;border-radius:6px;padding:3px;color:var(--muted);text-align:left}
.ph canvas{display:block;width:96px;height:64px;border-radius:4px;background:var(--panel-2)}
.ph span{display:block;font-size:11px;padding:3px 1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ph:hover{color:var(--fg)}.ph.on{border-color:var(--accent);color:var(--fg)}
.ph .del{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:18px;padding:0}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;height:86px;border:1px dashed var(--line);color:var(--muted);font-size:12px;gap:2px}
.ph.add b{font-size:20px;font-weight:400;line-height:1}
.ph.add:hover{border-color:var(--accent);color:var(--fg)}
.view.pan,.view.space,.view.space #cropbox{cursor:grab}.view.panning{cursor:grabbing}.view.pick{cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#main,#detail{position:absolute;left:0;top:0;display:block}
#detail{pointer-events:none}
.chip{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);border-radius:4px;padding:4px 8px;font:500 11px var(--font-mono);color:#ddd;pointer-events:none;font-variant-numeric:tabular-nums}
.chip.r{left:auto;right:12px}
.badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font:600 11px var(--font-cond);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:2px dashed var(--accent);background:rgba(240,160,75,.08);font:600 16px var(--font-cond);color:var(--accent);pointer-events:none}

/* crop */
#cropbox{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:1px solid rgba(255,255,255,.9);cursor:move}
#cropbox .g{position:absolute;background:rgba(255,255,255,.35);pointer-events:none}
#cropbox .h{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;background:rgba(0,0,0,.35);border-radius:3px}
.cropbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;
  background:rgba(24,24,26,.94);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:calc(100% - 24px)}
.cropbar select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.cropbar .straight{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cropbar .straight input{width:120px}

/* adjustment stack */
.adjust{grid-area:adjust;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.histo{padding:12px 14px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
#hist{width:100%;height:84px;display:block;background:#141416;border-radius:4px}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tools .btn{padding:5px 8px;font-size:12px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:8px;font:600 12px var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(45deg)}
details[open] summary{color:var(--fg)}
summary .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);visibility:hidden}
summary .dot.on{visibility:visible}
.body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.row label{font-size:12.5px;color:var(--muted);user-select:none;cursor:default}
.row label:hover{color:var(--fg)}
.row .val{width:64px;background:transparent;border:1px solid transparent;border-radius:4px;text-align:right;font:12px var(--font-mono);color:var(--fg);padding:1px 4px;font-variant-numeric:tabular-nums}
.row .val:focus{border-color:var(--line);background:var(--panel-2)}
.row input[type=range]{grid-column:1/-1}
.sub{font:600 11px var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.seg{display:flex;gap:2px;background:var(--panel-2);border-radius:6px;padding:2px}
.seg button{flex:1;background:none;border:0;border-radius:4px;padding:5px 4px;font-size:12px;color:var(--muted)}
.seg button.on{background:#3a3a40;color:var(--fg)}
.reset{align-self:flex-start;background:none;border:0;color:var(--faint);font-size:12px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--fg)}
.hint{font-size:11.5px;color:var(--faint);line-height:1.45}
#curve{width:100%;aspect-ratio:1;display:block;background:#141416;border-radius:4px;touch-action:none;cursor:crosshair}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;--a:0%;--b:0%;--track:linear-gradient(to right,var(--line),var(--line))}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,transparent var(--a),var(--accent) var(--a),var(--accent) var(--b),transparent var(--b)),var(--track)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(to right,transparent var(--a),var(--accent) var(--a),var(--accent) var(--b),transparent var(--b)),var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-5px;border:0;box-shadow:0 0 0 3px var(--panel)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:0;box-shadow:0 0 0 3px var(--panel)}
input[type=range].hue{--track:linear-gradient(to right,#f44,#fa4,#ff4,#4f4,#4ff,#44f,#f4f,#f44)}
input[type=range].hue::-webkit-slider-runnable-track{height:4px;background:var(--track)}
input[type=range].hue::-moz-range-track{height:4px;background:var(--track)}

/* export sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(520px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:600 18px var(--font-cond);letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sizes{display:flex;flex-wrap:wrap;gap:5px}
.sizes .btn{font-size:12px;padding:5px 8px}
.stat{font:12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:500}
#expPreview{max-width:100%;max-height:220px;align-self:center;border-radius:4px;display:block}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "view" "filters" "adjust"}
  .view{flex:none;height:56vh;min-height:320px}
  .filters,.adjust{border:0;border-top:1px solid var(--line)}
  .tiles{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:116px;grid-template-rows:auto;overflow-x:auto;overflow-y:hidden}
  .savelook{grid-column:auto;grid-row:1;width:220px;flex-direction:column}
  .empty{grid-column:auto;width:200px}
  .histo{position:static}
  .brand{width:100%;margin-bottom:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand"><i></i>Bready Darkroom</div>
    <div class="grp">
      <button class="btn" id="openBtn" title="Add photos (O)">Add photos</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <button class="btn" id="sampleBtn">Sample</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn" id="cropBtn" title="Crop & rotate (C)">Crop &amp; rotate</button>
      <button class="btn" id="beforeBtn" title="Hold to see the original (\)">Before</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn icon" id="zoomOut" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <span class="zoomlbl" id="zoomLbl">100%</span>
      <button class="btn icon" id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button class="btn" id="fitBtn" title="Fit to screen (0)">Fit</button>
      <button class="btn" id="oneBtn" title="Actual pixels (1)">1:1</button>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="exportBtn">Export</button>
  </header>

  <aside class="filters">
    <div class="tabs" role="tablist">
      <button data-tab="food" class="on">Food</button>
      <button data-tab="portrait">Portrait</button>
      <button data-tab="general">General</button>
      <button data-tab="mine">My looks</button>
    </div>
    <div class="amount" id="amountWrap"></div>
    <div class="tiles" id="tiles"></div>
  </aside>

  <section class="center">
  <main class="view pan" id="view">
    <canvas id="gl"></canvas>
    <div id="stage"><canvas id="main"></canvas><canvas id="detail" hidden></canvas></div>
    <div id="cropbox" hidden></div>
    <div class="cropbar" id="cropbar" hidden>
      <select id="aspect" aria-label="Aspect ratio">
        <option value="free">Free</option>
        <option value="orig">Original</option>
        <option value="1">1:1 Square</option>
        <option value="0.8">4:5 Instagram</option>
        <option value="1.5">3:2 Photo</option>
        <option value="1.3333">4:3</option>
        <option value="1.7778">16:9 Hero</option>
        <option value="0.5625">9:16 Story</option>
        <option value="0.6667">2:3 Portrait</option>
        <option value="1.9048">1.91:1 Social share</option>
        <option value="3">3:1 Banner</option>
      </select>
      <button class="btn icon" id="rotL" title="Rotate left" aria-label="Rotate left">⟲</button>
      <button class="btn icon" id="rotR" title="Rotate right" aria-label="Rotate right">⟳</button>
      <button class="btn" id="flipH">Flip H</button>
      <button class="btn" id="flipV">Flip V</button>
      <select id="cropFill" aria-label="Fill for empty corners" title="Colour for areas outside the photo">
        <option value="blur">Corners: blurred photo</option><option value="white">Corners: white</option><option value="black">Corners: black</option><option value="transparent">Corners: transparent</option></select>
      <label class="straight">Straighten <input type="range" id="straight" min="-45" max="45" step="0.1" value="0"><span id="straightVal" class="stat">0.0°</span></label>
      <span class="stat" style="flex-basis:100%;text-align:center;order:9">Drag the box past the photo edge to include more · scroll or pinch to zoom · hold Space to pan</span>
      <button class="btn" id="cropReset">Reset</button>
      <button class="btn" id="cropCancel">Cancel</button>
      <button class="btn primary" id="cropApply">Apply</button>
    </div>
    <div class="badge" id="beforeBadge" hidden>Original</div>
    <div class="chip" id="dimChip"></div>
    <div class="chip r" id="nameChip"></div>
    <div class="drop" id="drop" hidden>Drop photo to open</div>
  </main>
  <div class="strip" id="strip">
    <div class="strip-head">
      <span class="count" id="stripCount">1 photo</span>
      <button class="btn on" id="syncBtn" title="Every photo uses the same light and colour edits; crops stay per photo">Same look on all photos</button>
      <button class="btn" id="copyLookBtn" hidden>Copy this look to all</button>
      <span class="note" id="stripNote"></span>
      <button class="btn" id="exportAllBtn" hidden>Export all</button>
    </div>
    <div class="strip-row" id="stripRow"></div>
  </div>
  </section>

  <aside class="adjust" id="adjust">
    <div class="histo">
      <canvas id="hist" width="600" height="168"></canvas>
      <div class="tools">
        <button class="btn" id="autoBtn" title="Auto levels and tone">Auto</button>
        <button class="btn" id="wbBtn" title="Click something white or grey in the photo">White balance picker</button>
        <button class="btn" id="clipBtn" title="Red = blown highlights, blue = crushed shadows">Clipping</button>
        <button class="btn" id="resetAll">Reset all</button>
      </div>
    </div>
    <details open data-sec="light"><summary><span class="dot"></span>Light</summary><div class="body" id="sec-light"></div></details>
    <details open data-sec="color"><summary><span class="dot"></span>Color</summary><div class="body" id="sec-color"></div></details>
    <details data-sec="hsl"><summary><span class="dot"></span>HSL mixer</summary><div class="body" id="sec-hsl"></div></details>
    <details data-sec="curves"><summary><span class="dot"></span>Curves</summary><div class="body" id="sec-curves"></div></details>
    <details data-sec="levels"><summary><span class="dot"></span>Levels</summary><div class="body" id="sec-levels"></div></details>
    <details data-sec="grading"><summary><span class="dot"></span>Color grading</summary><div class="body" id="sec-grading"></div></details>
    <details data-sec="detail"><summary><span class="dot"></span>Detail</summary><div class="body" id="sec-detail"></div></details>
    <details data-sec="portrait"><summary><span class="dot"></span>Portrait retouch</summary><div class="body" id="sec-portrait"></div></details>
    <details data-sec="effects"><summary><span class="dot"></span>Effects</summary><div class="body" id="sec-effects"></div></details>
  </aside>
</div>

<div class="sheet" id="exportSheet" hidden>
  <div class="card" role="dialog" aria-labelledby="expTitle">
    <h2 id="expTitle">Export for web</h2>
    <div class="field" id="expScopeWrap" hidden><span>Photos</span>
      <div class="seg" id="expScope"><button data-v="one" class="on">This photo</button><button data-v="all" id="expAllLbl">All photos (.zip)</button></div></div>
    <div class="field"><span id="expNameLbl">File name</span><input type="text" id="expName" value="photo-edit"></div>
    <div class="two">
      <label class="field"><span>Format</span>
        <select id="expFmt"><option value="jpg">JPG (photos)</option><option value="webp">WebP (smallest)</option><option value="png">PNG (lossless)</option></select></label>
      <label class="field"><span>Quality <b id="expQVal" class="stat">82</b></span><input type="range" id="expQ" min="40" max="100" value="82"></label>
    </div>
    <div class="field"><span>Size presets</span>
      <div class="sizes" id="expSizes"></div>
    </div>
    <div class="two">
      <label class="field"><span>Width (px) — blank keeps original</span><input type="number" id="expW" min="16" max="12000" placeholder="original"></label>

  const b=document.createElement("button");b.className="tile"+(on?" on":"");b.innerHTML=`<canvas width="150" height="100"></canvas><span>${name}</span>`;
  b.onclick=click;if(extra)b.appendChild(extra);tilesEl.appendChild(b);return b.querySelector("canvas");}
function buildTiles(){
  tilesEl.innerHTML="";const jobs=[];thumbGen++;
  if(tab==="mine"){
    const wrap=document.createElement("div");wrap.className="savelook";
    wrap.innerHTML=`<input id="lookName" placeholder="Name this look" maxlength="40"><button class="btn" id="lookSave">Save current</button>`;tilesEl.appendChild(wrap);
    wrap.querySelector("#lookSave").onclick=()=>{const name=(wrap.querySelector("#lookName").value||"My look "+(loadMine().length+1)).trim();
      const a=loadMine();a.push({name,p:curP()});if(saveMine(a)){toast(`Saved “${name}”`);buildTiles();}else toast("This browser blocked saving looks");};
    const mine=loadMine();
    if(!mine.length){const e=document.createElement("div");e.className="empty";e.textContent="Save your current edit as a look, then apply it to every photo in the project for a consistent style.";tilesEl.appendChild(e);}
    mine.forEach((m,i)=>{const del=document.createElement("button");del.className="del";del.textContent="×";del.setAttribute("aria-label","Delete "+m.name);
      del.onclick=ev=>{ev.stopPropagation();const a=loadMine();a.splice(i,1);saveMine(a);buildTiles();};
      const c=makeTile(m.name,false,()=>{state.p=Object.assign(defaults(),clone(m.p));state.filter={id:null,amount:100};syncUI();schedule();commit();toast(`Applied “${m.name}”`);},del);
      jobs.push([c,m.p]);});
  }else{
    jobs.push([makeTile("Original",!state.filter.id,()=>selectFilter(null)),defaults()]);
    PRESETS[tab].forEach(([n,d])=>{const id=tab+":"+n;const c=makeTile(n,state.filter.id===id,()=>selectFilter(id));c.parentNode.dataset.id=id;jobs.push([c,effParams(defaults(),id,100)]);});
  }
  renderThumbs(jobs,thumbGen);
}
function selectFilter(id){state.filter.id=id;if(id&&!state.filter.amount)state.filter.amount=100;syncUI();schedule();commit();}
function syncFilterUI(){tilesEl.querySelectorAll(".tile").forEach(t=>{if(tab!=="mine")t.classList.toggle("on",(t.dataset.id||null)===state.filter.id);});
  $("#amountWrap").style.opacity=state.filter.id?1:.45;}
function thumbsDirty(){thumbSrc=null;if(src)buildTiles();}
function renderThumbs(jobs,gen){
  if(!src)return;
  if(gpu){const[W,H]=croppedFullDims(),c=state.geo.crop,fr={dispW:W,dispH:H,crop:[c.x,c.y,c.w,c.h]},sc=Math.max(150/W,100/H),v={tx:(150-W*sc)/2,ty:(100-H*sc)/2,scale:sc};
    let i=0;const step=()=>{if(gen!==thumbGen)return;const t0=performance.now();
      while(i<jobs.length&&performance.now()-t0<12){const[cv,P]=jobs[i++];cv.getContext("2d").putImageData(new ImageData(gpu.read(150,100,v,fr,P,{}),150,100),0,0);}
      if(i<jobs.length)requestAnimationFrame(step);};
    requestAnimationFrame(step);return;}
  if(!thumbSrc){const[W,H]=croppedFullDims();const c=buildGeo(Math.min(1,300/Math.max(W,H)),true);
    const d=c.getContext("2d").getImageData(0,0,c.width,c.height);thumbSrc={data:d.data,w:c.width,h:c.height,cache:{}};}
  let i=0;const step=()=>{if(gen!==thumbGen)return;const t0=performance.now();
    while(i<jobs.length&&performance.now()-t0<24){const[c,P]=jobs[i++];const o=processPixels(thumbSrc.data,thumbSrc.w,thumbSrc.h,P,{W:thumbSrc.w,H:thumbSrc.h,offX:0,offY:0},thumbSrc.cache);
      const tmp=document.createElement("canvas");tmp.width=thumbSrc.w;tmp.height=thumbSrc.h;tmp.getContext("2d").putImageData(new ImageData(o,thumbSrc.w,thumbSrc.h),0,0);
      const x=c.getContext("2d"),s=Math.max(150/tmp.width,100/tmp.height);x.drawImage(tmp,(150-tmp.width*s)/2,(100-tmp.height*s)/2,tmp.width*s,tmp.height*s);}
    if(i<jobs.length)setTimeout(step,0);};
  step();
}

/* ============================== photo set ============================== */
const defGeo=()=>({rot:0,flipH:false,flipV:false,straight:0,fill:"white",crop:{x:0,y:0,w:1,h:1}});
let photos=[],cur=-1,syncLook=true,uid=0,switching=false;
const stripRow=$("#stripRow");
function decodeFile(f){return new Promise((res,rej)=>{const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,WORK_MAX/Math.max(w,h));
    const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);res(c);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("unreadable"));};img.src=url;});}
function smallOf(c){const s=Math.min(1,160/Math.max(c.width,c.height)),t=document.createElement("canvas");t.width=Math.max(1,Math.round(c.width*s));t.height=Math.max(1,Math.round(c.height*s));
  const x=t.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(c,0,0,t.width,t.height);return{data:x.getImageData(0,0,t.width,t.height).data,w:t.width,h:t.height};}
function newPhoto(name,canvas,file){return{id:++uid,name,file:file||null,isSample:!file,geo:defGeo(),p:clone(state.p),filter:clone(state.filter),thumb:smallOf(canvas)};}
function stashCurrent(){if(cur<0||!photos[cur])return;const ph=photos[cur];ph.geo=clone(state.geo);ph.p=clone(state.p);ph.filter=clone(state.filter);}
function lookFor(ph){if(ph===photos[cur]||syncLook)return curP();return effParams(ph.p,ph.filter.id,ph.filter.amount);}
async function sourceFor(ph){return ph.isSample?makeSample():await decodeFile(ph.file);}
async function showPhoto(i,canvas){
  if(switching||i<0||i>=photos.length)return;switching=true;
  try{
    if(cropMode)exitCrop(true);
    stashCurrent();
    const ph=photos[i];let c=canvas;
    if(!c){try{c=await sourceFor(ph);}catch(e){toast(`Couldn't reopen “${ph.name}”`);return;}}
    cur=i;src=c;srcName=ph.name;if(gpu)gpu.setSource(c);
    state.geo=clone(ph.geo);
    if(!syncLook){state.p=clone(ph.p);state.filter=clone(ph.filter);}
    hist=[];histIdx=-1;commit();dispW=0;
    $("#nameChip").textContent=ph.name;
    schedule(true);thumbsDirty();syncUI();buildStrip();
    requestAnimationFrame(()=>fit());
  }finally{switching=false;}
}
async function addFiles(list){
  const files=[...list].filter(f=>f&&f.type&&f.type.startsWith("image/"));
  if(!files.length){toast("Those files aren't images the browser can read (JPG, PNG, WebP, GIF, AVIF)");return;}
  if(photos.length===1&&photos[0].isSample&&cur===0){stashCurrent();photos=[];cur=-1;}
  else stashCurrent();
  let first=-1,firstCanvas=null,bad=0,capped=0;
  toast(files.length>1?`Opening ${files.length} photos…`:"Opening photo…");
  for(const f of files){
    try{const c=await decodeFile(f);if(c.width*c.height<1)throw 0;
      const ph=newPhoto(f.name.replace(/\.[^.]+$/,""),c,f);
      if(!syncLook){ph.p=defaults();ph.filter={id:null,amount:100};}
      photos.push(ph);if(first<0){first=photos.length-1;firstCanvas=c;}
      if(Math.max(c.width,c.height)>=WORK_MAX)capped++;
    }catch(e){bad++;}
  }
  if(first<0){toast("Couldn't open those images. HEIC photos need converting to JPG first.");buildStrip();return;}
  await showPhoto(first,firstCanvas);
  const added=files.length-bad;
  toast(`${added} photo${added>1?"s":""} added${syncLook&&photos.length>1?" — all share the current look":""}${bad?` · ${bad} couldn't be opened`:""}${capped?` · large originals worked at ${WORK_MAX}px`:""}`);
}
function removePhoto(i){
  if(photos.length<=1)return;
  const wasCur=i===cur;photos.splice(i,1);
  if(wasCur){cur=-1;showPhoto(Math.min(i,photos.length-1));}
  else{if(i<cur)cur--;buildStrip();}
}
function buildStrip(){
  stripRow.innerHTML="";
  photos.forEach((ph,i)=>{
    const b=document.createElement("button");b.className="ph"+(i===cur?" on":"");b.title=ph.name;
    b.innerHTML=`<canvas width="96" height="64"></canvas><span>${i+1}. ${ph.name.replace(/[<>&]/g,"")}</span>`;
    b.onclick=()=>{if(i!==cur)showPhoto(i);};
    if(photos.length>1){const d=document.createElement("button");d.className="del";d.textContent="×";d.setAttribute("aria-label","Remove "+ph.name);
      d.onclick=e=>{e.stopPropagation();removePhoto(i);};b.appendChild(d);}
    stripRow.appendChild(b);ph.el=b.querySelector("canvas");
  });
  const add=document.createElement("button");add.className="ph add";add.innerHTML="<b>+</b>Add photos";add.onclick=()=>$("#file").click();stripRow.appendChild(add);
  const n=photos.length;
  $("#stripCount").textContent=n+" photo"+(n>1?"s":"");
  $("#exportAllBtn").hidden=n<2;$("#copyLookBtn").hidden=syncLook||n<2;
  $("#syncBtn").classList.toggle("on",syncLook);
  $("#stripNote").textContent=n<2?"Add more photos to edit them all with one lighting and colour look.":
    syncLook?"Edits and filters apply to every photo. Crop and rotation stay per photo.":"Each photo keeps its own edits.";
  stripRow.querySelector(".ph.on")?.scrollIntoView({block:"nearest",inline:"nearest"});
  drawStripThumbs();
}
let stripT=0;
function scheduleStrip(){clearTimeout(stripT);stripT=setTimeout(drawStripThumbs,180);}
function drawStripThumbs(){
  photos.forEach(ph=>{if(!ph.el)return;const t=ph.thumb;
    const o=processPixels(t.data,t.w,t.h,lookFor(ph),{W:t.w,H:t.h,offX:0,offY:0},null);
    const tmp=document.createElement("canvas");tmp.width=t.w;tmp.height=t.h;tmp.getContext("2d").putImageData(new ImageData(o,t.w,t.h),0,0);
    const x=ph.el.getContext("2d"),sc=Math.max(96/t.w,64/t.h);x.clearRect(0,0,96,64);x.drawImage(tmp,(96-t.w*sc)/2,(64-t.h*sc)/2,t.w*sc,t.h*sc);});
}
$("#syncBtn").onclick=()=>{
  syncLook=!syncLook;
  if(syncLook){stashCurrent();photos.forEach(ph=>{ph.p=clone(state.p);ph.filter=clone(state.filter);});toast("Every photo now uses this photo's look");}

$("#copyLookBtn").onclick=()=>{stashCurrent();photos.forEach(ph=>{ph.p=clone(state.p);ph.filter=clone(state.filter);});drawStripThumbs();toast(`Copied this look to ${photos.length} photos`);};
$("#exportAllBtn").onclick=()=>{openExport();setScope("all");};
$("#openBtn").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=[...e.target.files];e.target.value="";addFiles(f);};
viewEl.addEventListener("dragover",e=>{e.preventDefault();$("#drop").hidden=false;});
viewEl.addEventListener("dragleave",e=>{if(!viewEl.contains(e.relatedTarget))$("#drop").hidden=true;});
viewEl.addEventListener("drop",e=>{e.preventDefault();$("#drop").hidden=true;addFiles(e.dataTransfer.files);});

window.addEventListener("paste",e=>{const f=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile());if(f.length)addFiles(f);});

    x.beginPath();x.moveTo(0,y);for(let X=0;X<=W;X+=60)x.lineTo(X,y+Math.sin(X/180+i)*6+Math.sin(X/53)*2);x.stroke();}
  for(let i=1;i<5;i++){x.fillStyle="rgba(20,12,6,.35)";x.fillRect(0,i*H/5-2,W,3);}
  x.save();x.translate(150,880);x.rotate(-.08);x.fillStyle="#d9d4c8";x.shadowColor="rgba(0,0,0,.4)";x.shadowBlur=30;x.fillRect(-200,0,900,500);
  x.shadowBlur=0;x.strokeStyle="rgba(120,110,95,.25)";for(let i=0;i<40;i++){x.beginPath();x.moveTo(-200,i*12);x.lineTo(700,i*12);x.stroke();}

  x.save();x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=40;x.shadowOffsetY=20;
  g=x.createLinearGradient(420,260,1300,900);g.addColorStop(0,"#c99a62");g.addColorStop(1,"#9c6c3c");x.fillStyle=g;
  x.beginPath();x.roundRect(420,250,880,640,40);x.fill();x.restore();
  x.strokeStyle="rgba(90,55,25,.25)";for(let i=0;i<30;i++){x.lineWidth=1+Math.random()*2;x.beginPath();x.moveTo(440,270+i*21);x.bezierCurveTo(700,260+i*21+Math.random()*10,1000,280+i*21,1280,268+i*21);x.stroke();}
  x.save();x.shadowColor="rgba(0,0,0,.55)";x.shadowBlur=35;x.shadowOffsetY=18;
  g=x.createRadialGradient(820,520,40,860,560,330);g.addColorStop(0,"#d9934a");g.addColorStop(.6,"#a95f26");g.addColorStop(1,"#6e3712");x.fillStyle=g;

  for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(720+i*120,430+i*20);x.quadraticCurveTo(800+i*120,560,760+i*120,690-i*10);x.stroke();}
  for(let i=0;i<900;i++){const a=Math.random()*7,r=Math.random();x.fillStyle=`rgba(250,245,235,${Math.random()*.35})`;x.fillRect(860+Math.cos(a)*r*300,560+Math.sin(a)*r*170,2,2);}
  const tom=(cx,cy,r)=>{x.save();x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=25;x.shadowOffsetY=12;
    const gg=x.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r);gg.addColorStop(0,"#f36a4c");gg.addColorStop(.55,"#c8301e");gg.addColorStop(1,"#6e120a");
    x.fillStyle=gg;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.restore();
    x.fillStyle="rgba(255,255,255,.55)";x.beginPath();x.ellipse(cx-r*.35,cy-r*.42,r*.18,r*.1,-.6,0,7);x.fill();
    x.fillStyle="#3f6b2a";for(let k=0;k<5;k++){x.save();x.translate(cx,cy-r*.85);x.rotate(k*1.256);x.beginPath();x.ellipse(0,-r*.14,r*.06,r*.18,0,0,7);x.fill();x.restore();}};
  tom(1420,330,95);tom(1560,470,82);tom(1395,560,70);
  const leaf=(cx,cy,ang,s)=>{x.save();x.translate(cx,cy);x.rotate(ang);const gg=x.createLinearGradient(-60*s,0,60*s,0);gg.addColorStop(0,"#2f6b24");gg.addColorStop(1,"#5fa23b");

const sheet=$("#exportSheet");let expBlobUrl=null;
const SIZES=[["Original",0,0],["Hero 2560",2560,0],["Full width 1920",1920,0],["Content 1200",1200,0],["Card 800",800,0],["Thumb 400",400,0],["Social share 1200×630",1200,630],["Square 1080",1080,1080],["Instagram 1080×1350",1080,1350]];

function expDims(W,H){let w=parseInt($("#expW").value)||0,h=parseInt($("#expH").value)||0;
  if(!w&&h)w=Math.round(h*W/H);if(!w)w=W;

/* render the current source + geometry to an output canvas of size d using params P */
function renderOut(d,P){
  const[W,H]=croppedFullDims();
  if(gpu){if(d.w>gpu.maxTex||d.h>gpu.maxTex)throw new Error(`this device can render up to ${gpu.maxTex}px per side`);
    const c=state.geo.crop,fr={dispW:W,dispH:H,crop:[c.x,c.y,c.w,c.h]},sc=d.exact?Math.max(d.w/W,d.h/H):d.w/W;
    const v={tx:(d.w-W*sc)/2,ty:(d.h-H*sc)/2,scale:sc};
    const fin=document.createElement("canvas");fin.width=d.w;fin.height=d.h;
    fin.getContext("2d").putImageData(new ImageData(gpu.read(d.w,d.h,v,fr,P,{}),d.w,d.h),0,0);return fin;}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const now=new Date(),dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate(),tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;

    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);

  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/zip"});
}
async function saveBlob(blob,name){
  let dl=null;
  if(window.claude&&typeof window.claude.use==="function"){try{dl=await window.claude.use("downloads");}catch(e){dl=null;}
    if(dl){try{await dl.save({filename:name,data:blob});toast("Saved "+name);}
      catch(e){if(e&&e.code==="declined")toast("Save cancelled");else $("#expHint").textContent="Couldn't save here ("+(e&&e.message||"unavailable")+"). Right-click or long-press the preview above and choose Save image.";}
      return;}
    $("#expHint").textContent="Saving isn't available in this view. Right-click or long-press the preview above and choose Save image.";return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Saved "+name);
}

window.addEventListener("keydown",e=>{

  else if(mod&&k.toLowerCase()==="y"){e.preventDefault();restore(histIdx+1);}

  else if(k==="-"){zoomTo(view.scale/1.25);}

  else if(k==="1"){zoomTo(1);}

});
